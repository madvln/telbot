name: Telegram Bot CI/CD

on:
  push:
    branches:
      - ci-cd-try-1
  pull_request:
    branches:
      - ci-cd-try-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Проверка кода и установка зависимостей
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variable for TOKEN
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: echo "Environment variable TOKEN is set"

      - name: Run bot
        run: python3 main.py
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t madvln/telbot:latest .
          docker push madvln/telbot:latest

      - name: Deploy to server
        run: |
          ssh user@your-server "docker pull your-dockerhub-username/telegram-bot:latest && docker run -d --restart=always your-dockerhub-username/telegram-bot:latest"
